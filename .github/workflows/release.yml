name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run privacy:check
      - run: npm test
      - run: npm run mac:build
      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent "mac-dist/行迹.app" "行迹-macOS-arm64.zip"
          shasum -a 256 "行迹-macOS-arm64.zip" > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            行迹-macOS-arm64.zip
            SHA256SUMS.txt
